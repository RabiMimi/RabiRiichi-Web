<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /*
        Yuji Syuku, a brush face by calligrapher Yuji Kataoka, under the SIL
        Open Font License (see YujiSyuku-OFL.txt). Subset to JIS levels 1 and 2
        plus the strings the UI draws; regenerate with tools/subset-font.py
        after adding Japanese text.
      */
      @font-face {
        font-family: 'GameFont';
        src: url('/assets/YujiSyuku-Regular.subset.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      /* Aa沈夜食堂, subset to the Chinese and English UI strings. */
      @font-face {
        font-family: 'GameFontZH';
        src: url('/assets/AaShenYeShiTang.subset.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      /*
        Shown until React mounts and replaces it, so the wait for the main
        script on a slow first launch reads as loading rather than a blank page.
      */
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111111;
      }
      #boot-loader div {
        position: relative;
        width: min(16rem, 60vw);
        height: 6px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.15);
      }
      #boot-loader div::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 3px;
        background: #ff7a99;
        animation: boot-loader-slide 1.2s ease-in-out infinite;
      }
      @keyframes boot-loader-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
    <title>RabiRiichi</title>
  </head>

  <body>
    <div id="root">
      <div id="boot-loader" role="progressbar" aria-label="Loading">
        <div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
