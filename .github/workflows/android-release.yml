name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint Android wrapper
        run: bash gradlew --no-daemon lint assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check signing configuration
        shell: bash
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing GitHub Actions secret: $variable. See android/README.md."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rabiriichi.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/rabiriichi.jks" >> "$GITHUB_ENV"
      - name: Build signed release
        run: bash gradlew --no-daemon assembleRelease
      - name: Verify APK signature and prepare downloads
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/RabiRiichi.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release/RabiRiichi.apk | tee release/signing-certificate.txt
          cd release
          sha256sum RabiRiichi.apk > RabiRiichi.apk.sha256
      - name: Generate domain verification metadata from the signed APK
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re

          config = json.loads(pathlib.Path('client-config.json').read_text())
          certificate = pathlib.Path('release/signing-certificate.txt').read_text()
          match = re.search(r'^Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]{64})$', certificate, re.MULTILINE)
          if not match:
              raise SystemExit('Could not read the APK signing certificate SHA-256 digest')
          digest = match.group(1).upper()
          fingerprint = ':'.join(digest[index:index + 2] for index in range(0, 64, 2))
          statements = [{
              'relation': ['delegate_permission/common.handle_all_urls'],
              'target': {
                  'namespace': 'android_app',
                  'package_name': config['packageId'],
                  'sha256_cert_fingerprints': [fingerprint],
              },
          }]
          pathlib.Path('release/assetlinks.json').write_text(json.dumps(statements, indent=2) + '\n')
          pathlib.Path('release/certificate-fingerprint.txt').write_text(fingerprint + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android/release/
      - name: Publish versioned APK and stable download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="android-${ANDROID_VERSION_CODE}"
          cat > "$RUNNER_TEMP/android-release-notes.md" <<EOF
          Fullscreen landscape Android client for RabiRiichi.

          Opens Production; switch to Development on the login page or in the lobby.
          Web client updates arrive through the existing in-app updater.
          APK build: ${ANDROID_VERSION_CODE}; source: ${GITHUB_SHA}.
          EOF
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Android build ${ANDROID_VERSION_CODE}" --notes-file "$RUNNER_TEMP/android-release-notes.md" --latest=false
          fi
          gh release upload "$tag" release/* --clobber
          if gh release view android-latest > /dev/null 2>&1; then
            # --target only applies on creation; move the existing tag to this build's commit.
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/android-latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh release create android-latest --target "$GITHUB_SHA" --title 'Android client download' --notes-file "$RUNNER_TEMP/android-release-notes.md" --latest=false
          fi
          gh release upload android-latest release/* --clobber
          gh release edit android-latest --notes-file "$RUNNER_TEMP/android-release-notes.md"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/rabiriichi.jks"
